[project]
name = "hqrc-v3"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
hqrc = "hqrc_v3.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: opt-in sampler smoke tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
