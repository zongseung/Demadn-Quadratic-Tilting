schema_version = 1
models = ["xgboost", "lightgbm", "svr", "seq2seq_lstm", "transformer"]
validation_days = 61

[xgboost]
objective = "reg:squarederror"
eval_metric = "rmse"
n_estimators = 600
learning_rate = 0.03
max_depth = 6
min_child_weight = 3
subsample = 0.9
colsample_bytree = 0.8
reg_lambda = 1.0
tree_method = "hist"
early_stopping_rounds = 35

[lightgbm]
objective = "regression"
n_estimators = 800
learning_rate = 0.025
num_leaves = 31
min_child_samples = 20
subsample = 0.9
subsample_freq = 1
colsample_bytree = 0.8
reg_lambda = 1.0
early_stopping_rounds = 35

[svr]
kernel = "rbf"
C = 10.0
epsilon = 0.05
gamma = "scale"
cache_size = 512.0

[seq2seq_lstm]
hidden_size = 64
layers = 2
heads = 4
dropout = 0.1
learning_rate = 0.001
batch_size = 64
epochs = 60
patience = 8
seeds = [11, 23, 37, 41, 53]

[transformer]
hidden_size = 64
layers = 1
heads = 4
dropout = 0.1
learning_rate = 0.001
batch_size = 64
epochs = 60
patience = 8
seeds = [11, 23, 37, 41, 53]
